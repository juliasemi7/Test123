<!-- STREAMING_CHUNK:Setting up candidate name input form before test starts -->
<div id="candidate-form-container" class="py-6">
  <h2 class="text-xl font-semibold text-slate-900 mb-2">Enter Your Details</h2>
  <p class="text-sm text-slate-500 mb-6">Please enter your name and email before beginning the assessment.</p>
  <div class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Your Full Name</label>
      <input type="text" id="candidate-name" placeholder="e.g. John Doe" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:outline-none" required>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Your Email</label>
      <input type="email" id="candidate-email" placeholder="e.g. student@example.com" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:outline-none" required>
    </div>
    <button id="start-test-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition shadow-md shadow-indigo-100 cursor-pointer mt-4">
      Start Test (30 Mins)
    </button>
  </div>
</div>

<!-- STREAMING_CHUNK:Rendering main quiz container (hidden initially) -->
<div id="quiz-container" class="hidden">
  <div id="question-card" class="mb-6">
    <div class="flex justify-between items-center mb-2">
      <span id="question-counter" class="text-xs font-bold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md">Question 1 of 5</span>
      <span id="question-points" class="text-xs font-bold text-amber-600 bg-amber-50 px-2.5 py-1 rounded-md">10 Points</span>
    </div>
    <h2 id="question-text" class="text-lg md:text-xl font-semibold text-slate-900 mb-4">Loading question...</h2>
    
    <div id="options-list" class="space-y-3">
      <!-- Options injected via JS -->
    </div>

    <div id="hint-container" class="mt-4 hidden bg-sky-50 border border-sky-100 p-3 rounded-xl text-sky-800 text-sm">
      <span class="font-semibold">Hint:</span> <span id="hint-text"></span>
    </div>
  </div>

  <div class="flex items-center justify-between pt-4 border-t border-slate-100">
    <button id="hint-btn" class="text-sm text-indigo-600 hover:text-indigo-800 font-medium transition flex items-center gap-1 cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      Show Hint
    </button>
    <button id="next-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-2.5 rounded-xl transition shadow-md shadow-indigo-100 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
      Next Question
    </button>
  </div>
</div>

<!-- STREAMING_CHUNK:Rendering results summary container (hidden initially) -->
<div id="results-container" class="hidden text-center py-8">
  <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
    🏆
  </div>
  <h2 class="text-2xl font-bold text-slate-900 mb-2">Test Completed!</h2>
  <p id="score-text" class="text-slate-600 mb-2">You earned X out of Y total points.</p>
  <div id="level-badge" class="inline-block my-4 px-5 py-2 rounded-2xl font-bold text-lg bg-indigo-50 border border-indigo-200 text-indigo-800">
    Level: Calculating...
  </div>
  <p id="level-description" class="text-sm text-slate-500 mb-4 max-w-md mx-auto"></p>
  
  <div id="email-status" class="text-sm font-medium mb-6 text-indigo-600">
    Sending results to juliasemikolenova@gmail.com...
  </div>

  <div>
    <button onclick="location.reload()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-2.5 rounded-xl transition shadow-md shadow-indigo-100 cursor-pointer">
      Retake Test
    </button>
  </div>
</div>
