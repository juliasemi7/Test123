<!-- Candidate Form -->
<div id="candidate-form-container">
  <h2 style="font-size: 18px; margin-top: 0;">Enter Your Details</h2>
  <p style="color: #64748b; font-size: 14px;">Please enter your name and email before beginning.</p>
  <label style="font-size: 14px; font-weight: 500;">Your Full Name</label>
  <input type="text" id="candidate-name" class="input-field" placeholder="e.g. John Doe">
  <label style="font-size: 14px; font-weight: 500;">Your Email</label>
  <input type="email" id="candidate-email" class="input-field" placeholder="e.g. student@example.com">
  <button id="start-test-btn" class="btn">Start Test (30 Mins)</button>
</div>

<!-- Quiz Container -->
<div id="quiz-container" class="hidden">
  <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: bold; color: #4f46e5; margin-bottom: 8px; text-transform: uppercase;">
    <span id="question-counter">Question 1 of 5</span>
    <span id="question-points" style="color: #d97706;">10 Points</span>
  </div>
  <h2 id="question-text" style="font-size: 18px; margin-bottom: 20px;">Loading question...</h2>
  
  <div id="options-list"></div>

  <div id="hint-container" class="hidden" style="background: #e0f2fe; border: 1px. solid #bae6fd; padding: 12px; border-radius: 10px; color: #0369a1; font-size: 14px; margin-top: 15px;">
    <strong>Hint:</strong> <span id="hint-text"></span>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px; border-top: 1px solid #e2e8f0; padding-top: 16px;">
    <button id="hint-btn" style="background: none; border: none; color: #4f46e5; font-weight: 600; cursor: pointer; font-size: 14px;">Show Hint</button>
    <button id="next-btn" class="btn" style="width: auto; margin: 0; padding: 10px 24px;" disabled>Next Question</button>
  </div>
</div>

<!-- Results Container -->
<div id="results-container" class="hidden" style="text-align: center;">
  <div style="font-size: 40px; margin-bottom: 10px;">🏆</div>
  <h2 style="margin-top: 0;">Test Completed!</h2>
  <p id="score-text" style="color: #64748b;"></p>
  <div id="level-badge" class="badge">Level: Calculating...</div>
  <p id="level-description" style="color: #64748b; font-size: 14px; margin-bottom: 20px;"></p>
  <div id="email-status" style="font-size: 14px; color: #4f46e5; margin-bottom: 20px;">Sending results to juliasemikolenova@gmail.com...</div>
  <button onclick="location.reload()" class="btn" style="width: auto; display: inline-block;">Retake Test</button>
</div>
