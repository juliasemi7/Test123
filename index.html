    <script type="text/javascript">
        (function() {
            // ЗАМЕНИТЕ НА ВАШИ PUBLIC KEY, SERVICE ID И TEMPLATE ID ИЗ EMAILJS
            // --- БЛОК КОНФИГУРАЦИИ EMAILJS ---
            // Инструкцию по получению ключей можно найти здесь: https://www.emailjs.com/docs/sdk/installation/
            const EMAILJS_PUBLIC_KEY = "ВАШ_PUBLIC_KEY"; // (Строка) Ваш Public Key, например, "user_..." или "p_..."
            const EMAILJS_SERVICE_ID = "ВАШ_SERVICE_ID"; // (Строка) Ваш Service ID, например, "service_..."
            const EMAILJS_TEMPLATE_ID = "ВАШ_TEMPLATE_ID"; // (Строка) Ваш Template ID, например, "template_..."
            
            if (EMAILJS_PUBLIC_KEY === "ВАШ_PUBLIC_KEY") {
                 console.error("ОШИБКА: EmailJS ключи не настроены. Пожалуйста, замените заполнители в HTML-коде на ваши реальные ключи.");
            } else {
                 emailjs.init(EMAILJS_PUBLIC_KEY);
            }
            
            // Делаем конфигурацию доступной глобально для функции отправки
            window.emailConfig = {
                serviceId: EMAILJS_SERVICE_ID,
                templateId: EMAILJS_TEMPLATE_ID
            };
        })();
    </script>
